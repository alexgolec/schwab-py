name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true

    - name: Test with Python ${{ matrix.python }}
      run: uv run --python ${{ matrix.python }} coverage run -p -m pytest tests/

    - name: Report coverage
      if: matrix.python == '3.11' && matrix.platform == 'ubuntu-latest'
      run: |
        uv run --python 3.11 coverage combine
        uv run --python 3.11 coverage report
        uv run --python 3.11 coverage xml

    - name: Upload coverage to Codecov
      if: matrix.python == '3.11' && matrix.platform == 'ubuntu-latest'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: GitHub

    - name: Check built distributions
      if: matrix.python == '3.11' && matrix.platform == 'ubuntu-latest'
      run: |
        uv build
        uvx twine check dist/*

  readthedocs-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true

    - name: Verify that documentation builds
      run: uv run --python 3.12 --group docs sphinx-build -W docs/ docs-build
